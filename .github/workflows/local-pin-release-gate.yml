name: Local PIN release gate

# Production-realistic release gate for local PIN auth + related cash/security packs.
# Does not embed production secrets. Hosted-password Playwright runs only when
# repository variables/secrets for a real hosted fixture base are configured.
#
# Required jobs for a green gate: packs-and-security, phpstan-local-pin, e2e-local-pin.
# e2e-hosted-password is optional and skipped when POSMAIN_HOSTED_E2E_BASE is unset —
# a skip is not a pass (see docs/local_pin_release_signoff_checklist.md).
#
# Local equivalents (after schema import + migrations + seed_security_fixtures):
#   php scripts/local_pin_auth_preflight.php --json
#   bash scripts/run_security_contract_pack.sh
#   bash scripts/run_local_pin_auth_pack.sh
#   bash scripts/run_business_day_pack.sh
#   bash scripts/run_cash_flow_pack.sh
#   vendor/bin/phpunit --filter ProductionRbacPinTest --fail-on-skipped tests/security/ProductionRbacPinTest.php
#   vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --memory-limit=1G
#   POSMAIN_TEST_HTTP_BASE=http://127.0.0.1:8010 npm run test:e2e:local-pin
#
# Immediate rollback (not a schema drop): export POSMAIN_MAIN_AUTH_MODE=password
# then restart PHP/container; keep POSMAIN_PIN_SECRET if override PIN flows remain.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  POSMAIN_PIN_SECRET: posmain-ci-pin-secret-do-not-use-in-prod
  POSMAIN_MAIN_AUTH_MODE: pin
  POSMAIN_ROLE: branch
  POSMAIN_ENV: local
  POSMAIN_DB_HOST: 127.0.0.1
  POSMAIN_DB_PORT: "3306"
  POSMAIN_DB_USER: root
  POSMAIN_DB_PASS: root
  POSMAIN_DB_NAME: kody2
  POSMAIN_TEST_MYSQL_HOST: 127.0.0.1
  POSMAIN_TEST_MYSQL_PORT: "3306"
  POSMAIN_TEST_MYSQL_USER: root
  POSMAIN_TEST_MYSQL_PASS: root
  POSMAIN_TEST_MYSQL_DB: kody2

jobs:
  packs-and-security:
    name: Schema / packs / ProductionRbacPinTest
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kody2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, gd, bcmath, mysqli, imagick
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            if mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent; then
              echo "mysql-ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Import base schema (db/DB.sql)
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "DROP DATABASE IF EXISTS kody2; CREATE DATABASE kody2 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
          mysql -h127.0.0.1 -P3306 -uroot -proot kody2 < db/DB.sql
          if [[ -f db/moova_pos_integration.sql ]]; then
            mysql -h127.0.0.1 -P3306 -uroot -proot kody2 < db/moova_pos_integration.sql || true
          fi

      - name: Apply sync schema migrations
        run: php tools/run_migrations.php --apply --confirm-no-backup

      - name: Seed deterministic security fixtures
        run: php cli/seed_security_fixtures.php

      - name: Schema dry-run must be clean
        run: |
          out="$(php tools/run_migrations.php --dry-run)"
          echo "$out"
          echo "$out" | grep -q "0 pending sync schema change(s)"

      - name: Local PIN preflight
        run: php scripts/local_pin_auth_preflight.php --json

      - name: Security / RBAC contract pack
        run: bash scripts/run_security_contract_pack.sh

      - name: Local PIN auth pack
        run: bash scripts/run_local_pin_auth_pack.sh

      - name: Business-day pack
        run: bash scripts/run_business_day_pack.sh

      - name: Cash-flow pack
        run: bash scripts/run_cash_flow_pack.sh

      - name: PHPUnit ProductionRbacPinTest (fail on skipped)
        run: |
          # Require a live DB fixture so markTestSkipped("MySQL test database unavailable")
          # cannot silently green the release gate.
          vendor/bin/phpunit \
            --filter ProductionRbacPinTest \
            --fail-on-skipped \
            --colors=never \
            tests/security/ProductionRbacPinTest.php

  phpstan-local-pin:
    name: PHPStan local PIN / security paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, gd, bcmath, mysqli, imagick
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Ensure PHPStan is available
        run: |
          if [[ ! -x vendor/bin/phpstan ]]; then
            echo "phpstan/phpstan is not in composer.lock; installing for this job only."
            echo "BLOCKER_NOTE: add phpstan/phpstan to composer require-dev to make this deterministic."
            composer require --dev phpstan/phpstan:^2.0 --no-interaction --no-progress
          fi

      - name: Run PHPStan (no baseline swallow)
        run: |
          vendor/bin/phpstan analyse \
            --configuration=phpstan.neon.dist \
            --error-format=github \
            --no-progress \
            --memory-limit=1G

  e2e-local-pin:
    name: Playwright local PIN campaign
    runs-on: ubuntu-latest
    needs: packs-and-security
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kody2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, gd, bcmath, mysqli, imagick
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            if mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent; then
              echo "mysql-ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Import schema and apply migrations
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "DROP DATABASE IF EXISTS kody2; CREATE DATABASE kody2 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
          mysql -h127.0.0.1 -P3306 -uroot -proot kody2 < db/DB.sql
          php tools/run_migrations.php --apply --confirm-no-backup
          php cli/seed_security_fixtures.php

      - name: Start PHP built-in server
        run: |
          nohup php -S 127.0.0.1:8010 -t . > /tmp/posmain-php-server.log 2>&1 &
          echo $! > /tmp/posmain-php-server.pid
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8010/index.php" >/dev/null 2>&1; then
              echo "http-ready"
              exit 0
            fi
            sleep 1
          done
          echo "PHP server failed to become ready" >&2
          cat /tmp/posmain-php-server.log >&2 || true
          exit 1

      - name: Run local PIN Playwright campaign
        env:
          POSMAIN_TEST_HTTP_BASE: http://127.0.0.1:8010
          POSMAIN_QA_ENV: local
          POSMAIN_E2E_SKIP_IF_DOWN: "0"
          CI: "1"
        run: npm run test:e2e:local-pin

      - name: Stop PHP server
        if: always()
        run: |
          if [[ -f /tmp/posmain-php-server.pid ]]; then
            kill "$(cat /tmp/posmain-php-server.pid)" || true
          fi

  e2e-hosted-password:
    name: Playwright hosted-password campaign
    runs-on: ubuntu-latest
    # Do not claim pass when hosted fixtures are absent: job is skipped unless
    # a real hosted base URL is configured on the repository.
    if: ${{ vars.POSMAIN_HOSTED_E2E_BASE != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Require hosted fixture credentials
        env:
          POSMAIN_HOSTED_E2E_BASE: ${{ vars.POSMAIN_HOSTED_E2E_BASE }}
          POSMAIN_E2E_USER_ADMIN: ${{ secrets.POSMAIN_E2E_USER_ADMIN }}
          POSMAIN_E2E_PASS_ADMIN: ${{ secrets.POSMAIN_E2E_PASS_ADMIN }}
          POSMAIN_E2E_DEMO_PASSWORD: ${{ secrets.POSMAIN_E2E_DEMO_PASSWORD }}
        run: |
          missing=0
          if [[ -z "${POSMAIN_HOSTED_E2E_BASE}" ]]; then
            echo "Missing POSMAIN_HOSTED_E2E_BASE (repository variable)." >&2
            missing=1
          fi
          if [[ -z "${POSMAIN_E2E_USER_ADMIN}" || -z "${POSMAIN_E2E_PASS_ADMIN}${POSMAIN_E2E_DEMO_PASSWORD}" ]]; then
            echo "Missing hosted admin credentials (POSMAIN_E2E_USER_ADMIN + PASS/DEMO secret)." >&2
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Hosted-password campaign prerequisites are incomplete; refusing to claim pass." >&2
            exit 1
          fi

      - name: Run hosted-password Playwright campaign
        env:
          POSMAIN_TEST_HTTP_BASE: ${{ vars.POSMAIN_HOSTED_E2E_BASE }}
          POSMAIN_QA_ENV: hosted
          POSMAIN_E2E_SKIP_IF_DOWN: "0"
          POSMAIN_E2E_USER_ADMIN: ${{ secrets.POSMAIN_E2E_USER_ADMIN }}
          POSMAIN_E2E_PASS_ADMIN: ${{ secrets.POSMAIN_E2E_PASS_ADMIN }}
          POSMAIN_E2E_DEMO_PASSWORD: ${{ secrets.POSMAIN_E2E_DEMO_PASSWORD }}
          POSMAIN_E2E_USER_MANAGER: ${{ secrets.POSMAIN_E2E_USER_MANAGER }}
          POSMAIN_E2E_PASS_MANAGER: ${{ secrets.POSMAIN_E2E_PASS_MANAGER }}
          POSMAIN_E2E_USER_CASHIER: ${{ secrets.POSMAIN_E2E_USER_CASHIER }}
          POSMAIN_E2E_PASS_CASHIER: ${{ secrets.POSMAIN_E2E_PASS_CASHIER }}
          CI: "1"
        run: npm run test:e2e:hosted-password
