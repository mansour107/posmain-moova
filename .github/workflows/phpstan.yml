name: Static analysis (phpstan)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        extensions: mbstring, gd, bcmath, imagick

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Ensure PHPStan is available
      run: |
        if [[ ! -x vendor/bin/phpstan ]]; then
          echo "phpstan/phpstan is not in composer.lock; installing for this job only."
          echo "BLOCKER_NOTE: add phpstan/phpstan to composer require-dev to make this deterministic."
          composer require --dev phpstan/phpstan:^2.0 --no-interaction --no-progress
        fi

    - name: Run analysis
      run: |
        vendor/bin/phpstan analyse \
          --configuration=phpstan.neon.dist \
          --error-format=github \
          --no-progress \
          --memory-limit=1G
