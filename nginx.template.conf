worker_processes 5;
daemon off;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include $!{nginx}/conf/mime.types;
    index index.html index.htm index.php;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] $status '
                    '"$request" $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    error_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;
        root /app;

        index index.php;
        charset utf-8;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location ~ ^/(\.git|backup|logs|var|db|dbase|update|tools|tests|cli|deploy|docs)(/|$) {
            return 403;
        }

        location ~ (^|/)\.env(\.|$) {
            return 403;
        }

        location ~ /(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|phpstan\.neon\.dist|railway\.json|nixpacks\.toml|Dockerfile.*)$ {
            return 403;
        }

        location ~ \.(sql|log|bak|patch)$ {
            return 403;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|ttf|otf|woff|woff2|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }
    }
}
