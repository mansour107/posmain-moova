# Goal Maker v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "POSMAIN Phase 4 Mid-Scale Restaurant Product"
  slug: "posmain-phase-4-midscale-product"
  kind: specific
  tranche: "Implement Phase 4 mid-scale restaurant/cafe product completion on top of completed Phase 0-3 artifacts, with safe scoped changes and focused verification."
