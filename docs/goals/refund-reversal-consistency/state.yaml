  slug: "refund-reversal-consistency"
  kind: specific
  tranche: "Implement and verify the approved V1 refund-reversal plan across writes, reports, shifts, accounting, admin drilldown, and sync."
  status: done

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

