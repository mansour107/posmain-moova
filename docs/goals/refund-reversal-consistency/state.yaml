    expected_output:
      - "Impacted surface map"
      - "Known correctness gaps"
    receipt:
      result: done
      summary: "Mapped the refund API/browser split, credit-note and payment-refund ledgers, shift/drawer paths, local/cloud reports, customer/product rollups, and current test coverage."
