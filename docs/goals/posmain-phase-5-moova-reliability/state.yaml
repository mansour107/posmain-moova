      - "docs/goals/posmain-phase-0-production-readiness"
      - "docs/goals/posmain-phase-1-production-foundation"
      - "docs/goals/posmain-phase-2-pos-state"
      - "docs/goals/posmain-phase-3-security-hardening"
      - "docs/goals/posmain-phase-4-midscale-product"
      - "docs/production"
