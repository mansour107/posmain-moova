version: 2

goal:
  title: "POSMAIN Commercial V1 Completion"
  slug: "posmain-commercial-v1-completion"
  kind: broad
  tranche: "Reconcile completed work, close remaining local blockers, and produce current launch evidence"
  status: blocked_external

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

