        - "Tracked debug, repair, SQL, office-document, screenshot, and credential-cracking artifacts are present in the repository."
        - "API and get PHP surfaces are not covered by the existing manifest completeness test."
        - "There is no composer.lock, so dependency reproducibility cannot yet be certified."
