      - "Do not implement."
      - "Do not expose real secrets."
    expected_output:
      - "Approved HMAC protected-secret pattern"
      - "Approved shadow/apply/receive-only response contract"
      - "Approved Moova cursor schema"
      - "Worker task constraints for implementation"
    receipt:
      result: done
      decision: "Approve design gates for local/dev implementation. Do not start cloud/Moova runtime work yet. Next active Worker is T012 with expanded schema scaffolding and focused tests."
      constrained_designs:
        hmac_protected_secret:
          local_dev: "Implement a SecretProvider abstraction keyed by branch_uuid. Branch and local cloud load dummy/fake secrets from env or ignored local config; tests may use committed dummy fixture secrets."
          validation: "CloudAuthService must validate active branch, timestamp window, nonce policy if present, and HMAC_SHA256(secret, timestamp + newline + nonce + newline + raw_body) with hash_equals."
          database_boundary: "cloud_branches.sync_secret_hash is audit/provisioning metadata only, not a signing key."
          production_block: "Production HMAC validation is blocked until owner chooses protected secret store/provider and rotation."
        shadow_apply_response_contract:
          modes: "receive_only when POSMAIN_CLOUD_APPLY_ENABLED=0; shadow_apply when apply enabled and POSMAIN_SYNC_SHADOW_MODE=1; live_apply when apply enabled and shadow mode off."
          accepted_shadow: "accepted_shadow is successful branch delivery; mark outbox synced for processed, duplicate, stale, and accepted_shadow."
          receive_only: "Store sync_inbox/audit, do not apply snapshots, return accepted_shadow with applied=false and report_trusted=false."
          shadow_apply: "Apply snapshots/comparison state, mark reports untrusted, return accepted_shadow with applied=true and report_trusted=false."
        moova_cursor_schema:
          strategy: "Use cloud_moova_branch_events.id as v1 canonical cursor; do not create NOT NULL cursor_value=id before insert."
          api_contract: "after_cursor is an exclusive id cursor with branch_uuid/status/id index and ORDER BY id ASC LIMIT."
          ack: "Ack by event_uuid/idempotency_key, not cursor_value."
      next_allowed_task: T012
