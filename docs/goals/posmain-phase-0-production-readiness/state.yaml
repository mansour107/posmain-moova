    assignee: Scout
    status: done
    objective: "Map Phase 0 impacted surfaces, active write routes, route ownership, and verification commands."
    inputs:
      - "Phase 0 plan"
      - "Current repo files"
      - "Existing tests/tools"
    constraints:
      - "Read-only."
      - "Prefer concrete file-path evidence."
    expected_output:
      - "Impacted surfaces and compatibility risks."
      - "Write-surface classification evidence."
      - "Active route map evidence."
      - "Focused verification commands."
    receipt:
      result: done
      note: "notes/T002-phase0-scout-map.md"
      summary: "Mapped Phase 0 surfaces: active cashier/table/Moova writes, D-class debug/setup/repair routes, offline adapter inclusion, DB/runtime verification blockers, and focused checks."
