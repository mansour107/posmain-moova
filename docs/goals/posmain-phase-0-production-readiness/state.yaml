# Goal Maker v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "POSMAIN Phase 0 Production Readiness"
  slug: "posmain-phase-0-production-readiness"
  kind: specific
  tranche: "Implement Phase 0: branch/baseline, write-route ownership docs, production guard, offline prototype gating, and verification."
  status: done

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    objective: "Create the Goal Maker board and establish the dedicated Phase 0 branch/baseline fingerprint."
    inputs:
      - "/Users/ab.mansour1agmail.com/Desktop/pos expansion plan.txt"
      - "git status --short"
      - "git diff --stat"
    constraints:
      - "Do not discard dirty worktree changes."
      - "Only write Goal Maker control files and safe baseline artifacts."
    expected_output:
      - "Goal board exists and passes checker."
      - "Dedicated branch exists or current branch is documented."
      - "Current dirty state is captured."
    receipt:
      result: done
      summary: "Goal board created, checker passed, and dirty worktree carried onto dedicated branch codex/posmain-phase-0-production-readiness without discarding changes."
      evidence:
        - "docs/goals/posmain-phase-0-production-readiness/goal.md"
        - "docs/goals/posmain-phase-0-production-readiness/state.yaml"
        - "/tmp/posmain-current-diff-before-production-plan.patch"
        - "/tmp/posmain-current-diff-before-production-plan.stat"
      commands:
        - cmd: "node /Users/ab.mansour1agmail.com/.codex/skills/goal-maker/scripts/check-goal-state.mjs docs/goals/posmain-phase-0-production-readiness/state.yaml"
