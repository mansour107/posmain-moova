        - "includes/pos_content.php"
        - "tables.php"
        - "js/pos_barcode.js"
        - "elements/pos/cofe_widget.php"
        - "tools/audit_write_paths.php"
        - "tools/run_migrations.php"
        - "docker-compose.posmain-test.yml"
      commands:
        - cmd: "php tools/audit_write_paths.php --json"
          status: pass
        - cmd: "php tools/run_migrations.php --dry-run"
