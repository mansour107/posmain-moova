# Goal Maker v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "POSMAIN Phase 1 Production Foundation"
  slug: "posmain-phase-1-production-foundation"
  kind: specific
  tranche: "Implement Phase 1 production foundation from the POS expansion plan using Phase 0 docs as baseline."
  status: done

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    objective: "Create the Phase 1 Goal Maker board and bind it to Phase 0 artifacts."
    inputs:
      - "/Users/ab.mansour1agmail.com/Desktop/pos expansion plan.txt"
      - "docs/goals/posmain-phase-0-production-readiness/"
      - "docs/production/"
    constraints:
      - "Only write Goal Maker control files."
      - "Do not edit implementation files before the board exists."
    expected_output:
      - "Goal board exists and first active task is safe/read-only."
      - "Scout, Worker, and Judge roles are available."
    receipt:
      result: done
      changed_files:
        - "docs/goals/posmain-phase-1-production-foundation/goal.md"
        - "docs/goals/posmain-phase-1-production-foundation/state.yaml"
      summary: "Created Phase 1 Goal Maker board; agents are available from the configured goal_scout, goal_worker, and goal_judge roles."
