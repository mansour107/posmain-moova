    status: done
    objective: "Map Phase 1 requirements against current Phase 0 artifacts and repo files before implementation."
    inputs:
      - "Phase 1 plan"
      - "docs/production/"
      - "Existing config/session/password/migration/health files"
    constraints:
      - "Read-only."
      - "Prefer concrete file-path evidence."
      - "Identify unrelated dirty worktree changes that must not be touched."
    expected_output:
      - "Impacted surfaces and compatibility risks."
      - "Current implementation gaps."
      - "Focused Worker slices and verification commands."
    receipt:
      result: done
      note: "notes/T002-phase1-scout-map.md"
      summary: "Mapped Phase 1 against Phase 0 artifacts and current code. Main gaps are hardcoded DB runtime paths, committed config/database.php secret, missing .env.example/session bootstrap/password service, missing upload/private-dir deny rules, no Phase 1 backup runbook, and no general health endpoint."
