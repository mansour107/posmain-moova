          status: pass
        - cmd: "POSMAIN_DB_PORT=3307 php tools/run_migrations.php --dry-run"
          status: pass
        - cmd: "php -l config/app_config.php && php -l includes/db_bootstrap.php && php -l includes/connect.php && php -l print/includes/connect.php && php -l index.php && php -l tools/run_migrations.php && php -l api/sync/status.php"
